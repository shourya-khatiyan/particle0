[package]
name = "particle0"
version = "0.1.0"
description = "particle0 — Windows desktop AI overlay assistant"
authors = ["particle0"]
edition = "2021"

[lib]
name = "particle0_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core + plugins
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client with streaming and TLS
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }

# Async stream utilities
futures = "0.3"

# Error handling
thiserror = "2"

# Unique request IDs
uuid = { version = "1", features = ["v4"] }

# URL validation in settings
url = "2"

# Error chaining
anyhow = "1"

# Byte buffer utilities
bytes = "1"

# Logging
log = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
# Optimize for size — keeps the binary lean
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
